name: CI

# Revisión en cada pull request y en cada push. No publica nada
# (la publicación está en deploy.yml).
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci
          npm --prefix functions ci
      - name: Pruebas del paquete compartido
        run: npm test -w packages/shared
      - name: Revisión de tipos
        run: |
          npm run typecheck
          npm run typecheck -w tests/rules
      - name: Build de Functions
        run: npm run functions:build
      # La config web (VITE_*) sale de apps/web/.env.production, que está en el repo.
      - name: Build del panel
        run: npm run build

  rules:
    name: Pruebas de reglas de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Los emuladores de Firestore y Storage corren en Java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Caché de los emuladores de Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas de firestore.rules y storage.rules
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules.log
      # Si falla, las últimas líneas del log quedan como anotación (visible sin iniciar sesión)
      - name: Resumen del error
        if: failure()
        run: |
          tail -n 60 rules.log | sed 's/\x1b\[[0-9;]*m//g' > tail.log || true
          echo "::error title=Log de pruebas de reglas::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' tail.log)"
